[project]
name = "peak"
version = "0.1.0"
description = "This is an SLM Project"
readme = "README.md"
authors = [
    
]
requires-python = ">=3.12.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "hf-xet>=1.6.0",
    "huggingface-hub>=1.29.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.1",
    "nbformat>=5.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "plotly>=7.0.0",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torchao>=0.18.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers[torch]>=5.16.1",
]

[project.scripts]
developmodel = "developmodel:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url =  "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    {index= "pytorch-cu132",marker = "sys_platform == 'win32' or sys_platform == 'linux'"},
]
torchvision = [
    {index= "pytorch-cu132",marker = "sys_platform == 'win32' or sys_platform == 'linux'"}
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

